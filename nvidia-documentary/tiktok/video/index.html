<!doctype html>
<html lang="fr"
  data-composition-variables='[
    {"id":"samples","type":"number","label":"Sous-échantillons par image","default":5},
    {"id":"scale","type":"number","label":"Échelle de la résolution interne","default":1},
    {"id":"fps","type":"number","label":"Cadence (obturateur)","default":24},
    {"id":"timeOffset","type":"number","label":"Décalage de lecture (s)","default":0}
  ]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Comment NVIDIA fonctionne vraiment</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #020304; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #020304; }
      #gl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: block; }
      #hud { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="63" data-width="1080" data-height="1920">
      <canvas id="gl" class="clip" data-start="0" data-duration="63" data-track-index="0" width="1080" height="1920"></canvas>
      <div id="hud" class="clip" data-start="0" data-duration="63" data-track-index="1"></div>
    </div>
    <script src="scene.js"></script>
    <script>
      // Le rendu est entièrement piloté par l'évènement hf-seek (voir src/main.js) ; la timeline GSAP
      // ne sert ici qu'à déclarer la durée de la composition au runtime.
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 63 });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
